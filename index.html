<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哲学の問い（試作版）</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; margin: .25rem 0 .5rem; font-size: 1rem; }
  textarea { min-height: 5rem; }
  button { padding: .4rem .9rem; font-size: .95rem; margin: 0 .4rem .4rem 0; cursor: pointer; }
  .meta { font-size: .85rem; color: #666; }
  .text { white-space: pre-wrap; }
  #msg { color: #b00; min-height: 1.5em; }
  .hidden { display: none; }
  .thesis-item { border-top: 1px solid #eee; padding: .6rem 0; cursor: pointer; }
  .thesis-item:hover { background: #fafafa; }
  .thesis { font-size: 1.15rem; font-weight: bold; }
  .node { margin: .6rem 0 0 .8rem; padding: .4rem .6rem; border-left: 4px solid #ccc; }
  .node.pro { border-left-color: #2e8b57; }
  .node.con { border-left-color: #c0392b; }
  .label { font-size: .8rem; font-weight: bold; padding: 0 .4rem; border-radius: 4px; color: #fff; margin-right: .4rem; }
  .label.pro { background: #2e8b57; }
  .label.con { background: #c0392b; }
  .small { font-size: .85rem; padding: .2rem .6rem; }
  a { color: #1a5fb4; cursor: pointer; }
</style>
</head>
<body>
<h1>哲学の問い（試作版）</h1>
<p id="msg"></p>

<!-- ログイン / 新規登録 -->
<section id="authBox">
  <h2>ログイン / 新規登録</h2>
  <label>メールアドレス<input id="email" type="email" autocomplete="email"></label>
  <label>パスワード（6文字以上）<input id="password" type="password" autocomplete="current-password"></label>
  <label>仮名（新規登録のときだけ入力・30字まで）<input id="displayName" maxlength="30"></label>
  <button id="loginBtn">ログイン</button>
  <button id="signupBtn">新規登録</button>
  <button id="resetBtn">パスワードを忘れた</button>
</section>

<section id="userBox" class="hidden">
  <b id="me"></b> としてログイン中　<button id="logoutBtn" class="small">ログアウト</button>
</section>

<!-- 一覧画面 -->
<div id="homeView">
  <section id="newThesisBox" class="hidden">
    <h2>新しい問いを立てる</h2>
    <textarea id="thesisBody" maxlength="5000" placeholder="例：自由意志は存在する。"></textarea>
    <button id="thesisBtn">投稿</button>
  </section>
  <section>
    <h2>問いの一覧</h2>
    <div id="thesisList">読み込み中…</div>
  </section>
</div>

<!-- 議論画面 -->
<div id="debateView" class="hidden">
  <p><a id="backLink">← 問いの一覧に戻る</a></p>
  <section id="debateBox">読み込み中…</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail, sendEmailVerification
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, collection,
  query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUd7ST9PwUUbDitqpIQvf5XQcMgcBXLoQ",
  authDomain: "philosophy-site-25949.firebaseapp.com",
  projectId: "philosophy-site-25949",
  storageBucket: "philosophy-site-25949.firebasestorage.app",
  messagingSenderId: "41871063058",
  appId: "1:41871063058:web:5c0d9b64f4af3986d980cb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const say = (text) => { $("msg").textContent = text; };
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // 文字として表示（HTMLとして解釈しない）
  return e;
};
const timeOf = (p) => p.createdAt ? p.createdAt.toMillis() : Date.now();
const whenText = (p) => p.createdAt ? p.createdAt.toDate().toLocaleString("ja-JP") : "送信中…";

// ---------- 仮名の取得 ----------
const nameCache = {};
async function getName(uid) {
  if (!(uid in nameCache)) {
    try {
      const snap = await getDoc(doc(db, "users", uid));
      nameCache[uid] = snap.exists() ? snap.data().displayName : "（仮名未設定）";
    } catch (e) {
      nameCache[uid] = "（不明）";
    }
  }
  return nameCache[uid];
}

// ---------- アカウント ----------
$("signupBtn").onclick = async () => {
  const name = $("displayName").value.trim();
  if (!name) return say("新規登録には仮名を入力してください。");
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    await setDoc(doc(db, "users", cred.user.uid), { displayName: name, createdAt: serverTimestamp() });
    nameCache[cred.user.uid] = name;
    $("me").textContent = name;
    await sendEmailVerification(cred.user);
    say("登録しました。確認メールを送りました。");
  } catch (e) {
    say("登録できませんでした。メールアドレスの形式と、パスワードが6文字以上かを確認してください。");
  }
};

$("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    say("");
  } catch (e) {
    say("メールアドレスまたはパスワードが正しくありません。");
  }
};

$("resetBtn").onclick = async () => {
  try { await sendPasswordResetEmail(auth, $("email").value.trim()); } catch (e) {}
  say("登録されているメールアドレスであれば、再設定用のメールを送りました。");
};

$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  $("authBox").classList.toggle("hidden", !!user);
  $("userBox").classList.toggle("hidden", !user);
  $("newThesisBox").classList.toggle("hidden", !user);
  if (user) $("me").textContent = await getName(user.uid);
  if (currentRootId) renderDebate();   // ログイン状態で「賛成/反対」ボタンの表示が変わる
});

// ---------- 投稿の保存 ----------
async function savePost({ body, parentId, rootId, stance }) {
  const ref = doc(collection(db, "posts"));      // 先にIDを決める
  await setDoc(ref, {
    authorId: auth.currentUser.uid,
    body: body,
    createdAt: serverTimestamp(),
    parentId: parentId,                          // 問いなら null
    rootId: rootId || ref.id,                    // 問いなら自分自身のID
    stance: stance                               // "pro" / "con"、問いなら null
  });
  return ref.id;
}

// 新しい問い
$("thesisBtn").onclick = async () => {
  const body = $("thesisBody").value.trim();
  if (!body) return say("問いを入力してください。");
  try {
    await savePost({ body, parentId: null, rootId: null, stance: null });
    $("thesisBody").value = "";
    say("");
  } catch (e) {
    say("投稿できませんでした。");
  }
};

// ---------- 一覧画面 ----------
onSnapshot(query(collection(db, "posts"), where("parentId", "==", null)), async (snap) => {
  const box = $("thesisList");
  if (snap.empty) { box.textContent = "まだ問いがありません。"; return; }
  const theses = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
                          .sort((a, b) => timeOf(b) - timeOf(a));
  const items = await Promise.all(theses.map(async (t) => {
    const div = el("div", "thesis-item");
    div.append(el("div", "text", t.body), el("div", "meta", (await getName(t.authorId)) + "　" + whenText(t)));
    div.onclick = () => openDebate(t.id);
    return div;
  }));
  box.replaceChildren(...items);
}, () => { $("thesisList").textContent = "読み込めませんでした。"; });

// ---------- 議論画面 ----------
let currentRootId = null;
let unsubscribe = null;
let nodes = [];                 // この議論のすべての投稿
let openForm = null;            // 開いている書き込み欄 { parentId, stance, text }

function openDebate(rootId) {
  currentRootId = rootId;
  openForm = null;
  nodes = [];
  $("homeView").classList.add("hidden");
  $("debateView").classList.remove("hidden");
  $("debateBox").textContent = "読み込み中…";
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(query(collection(db, "posts"), where("rootId", "==", rootId)), (snap) => {
    nodes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderDebate();
  }, () => { $("debateBox").textContent = "読み込めませんでした。"; });
  window.scrollTo(0, 0);
}

$("backLink").onclick = () => {
  if (unsubscribe) unsubscribe();
  unsubscribe = null;
  currentRootId = null;
  $("debateView").classList.add("hidden");
  $("homeView").classList.remove("hidden");
};

async function renderDebate() {
  const root = nodes.find((n) => n.id === currentRootId);
  if (!root) return;
  // 親ごとに子をまとめる（賛成→反対、それぞれ古い順）
  const children = {};
  for (const n of nodes) {
    if (!n.parentId) continue;
    (children[n.parentId] = children[n.parentId] || []).push(n);
  }
  for (const list of Object.values(children)) {
    list.sort((a, b) => (a.stance === b.stance ? timeOf(a) - timeOf(b) : a.stance === "pro" ? -1 : 1));
  }
  await Promise.all(nodes.map((n) => getName(n.authorId)));   // 仮名を先に読み込む

  const box = $("debateBox");
  const top = el("div");
  top.append(el("div", "thesis text", root.body),
             el("div", "meta", nameCache[root.authorId] + "　" + whenText(root)));
  top.append(actions(root), childList(root.id, children));
  box.replaceChildren(top);
}

// ある投稿の下にぶら下がる賛成・反対のツリー
function childList(parentId, children) {
  const wrap = el("div");
  for (const n of children[parentId] || []) {
    const node = el("div", "node " + n.stance);
    const head = el("div", "meta");
    head.append(el("span", "label " + n.stance, n.stance === "pro" ? "賛成" : "反対"),
                document.createTextNode(nameCache[n.authorId] + "　" + whenText(n)));
    node.append(head, el("div", "text", n.body), actions(n), childList(n.id, children));
    wrap.append(node);
  }
  return wrap;
}

// 「賛成する／反対する」ボタンと書き込み欄
function actions(target) {
  const box = el("div");
  if (!auth.currentUser) return box;
  for (const stance of ["pro", "con"]) {
    const b = el("button", "small", stance === "pro" ? "賛成の論拠を書く" : "反対の論拠を書く");
    b.onclick = () => { openForm = { parentId: target.id, stance, text: "" }; renderDebate(); };
    box.append(b);
  }
  if (openForm && openForm.parentId === target.id) {
    const ta = el("textarea");
    ta.maxLength = 5000;
    ta.placeholder = openForm.stance === "pro" ? "賛成の理由を書いてください" : "反対の理由を書いてください";
    ta.value = openForm.text;
    ta.oninput = () => { openForm.text = ta.value; };
    const send = el("button", "small", "投稿");
    send.onclick = async () => {
      const body = ta.value.trim();
      if (!body) return say("内容を入力してください。");
      try {
        await savePost({ body, parentId: target.id, rootId: currentRootId, stance: openForm.stance });
        openForm = null;
        say("");
        renderDebate();
      } catch (e) {
        say("投稿できませんでした。");
      }
    };
    const cancel = el("button", "small", "やめる");
    cancel.onclick = () => { openForm = null; renderDebate(); };
    box.append(el("div", "meta", openForm.stance === "pro" ? "賛成の論拠" : "反対の論拠"), ta, send, cancel);
    setTimeout(() => ta.focus(), 0);
  }
  return box;
}
</script>
</body>
</html>
